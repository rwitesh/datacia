name: Release

# Push a version tag (e.g. v2.0.0) to build the macOS and Windows assets and
# publish them as a GitHub Release. The tag is the only source of the app
# version: it is passed to the build as VERSION. Tags with a pre-release suffix
# (e.g. v2.1.0-rc.1) are published as pre-releases, so they never become "latest".
#
# Assets (X.Y.Z = version, ARCH = universal | arm64 | amd64):
#   DataCia-X.Y.Z-darwin-ARCH.dmg                first installs (macOS)
#   DataCia-X.Y.Z-windows-ARCH-installer.exe     first installs (Windows)
#   DataCia-X.Y.Z-darwin-ARCH.zip                in-app update: replaces DataCia.app
#   DataCia-X.Y.Z-windows-amd64.exe / -arm64.exe in-app update: replaces DataCia.exe
#   SHA256SUMS                                   checked by the in-app updater
# Older builds only update from -darwin-universal.zip, so keep publishing it.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  WAILS_VERSION: v3.0.0-beta.30

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - id: version
        name: Read version from tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::Tag $GITHUB_REF_NAME is not a version tag like v2.0.0"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  macos:
    needs: verify
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: go install github.com/wailsapp/wails/v3/cmd/wails3@${WAILS_VERSION}
      - name: Build DMG and update zip per architecture
        run: |
          for arch in universal arm64 amd64; do
            wails3 task darwin:package:release ARCH=$arch VERSION=${{ needs.verify.outputs.version }}
            mv bin/DataCia.dmg "bin/DataCia-${{ needs.verify.outputs.version }}-darwin-$arch.dmg"
            mv bin/DataCia.zip "bin/DataCia-${{ needs.verify.outputs.version }}-darwin-$arch.zip"
          done
      - uses: actions/upload-artifact@v5
        with:
          name: macos
          path: |
            bin/*-darwin-*.dmg
            bin/*-darwin-*.zip

  windows:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # nsis builds the installer; the GTK4/WebKitGTK headers are needed to compile
      # the wails3 CLI on Linux.
      - run: sudo apt-get update && sudo apt-get install -y nsis libgtk-4-dev libwebkitgtk-6.0-dev
      - run: go install github.com/wailsapp/wails/v3/cmd/wails3@${WAILS_VERSION}
      - name: Build NSIS installers (cross-compiled, pure Go)
        run: |
          for arch in universal amd64 arm64; do
            wails3 task windows:package ARCH=$arch VERSION=${{ needs.verify.outputs.version }}
          done
      # The universal build also leaves the per-architecture binaries, which the
      # in-app updater swaps in place of the running DataCia.exe.
      - run: |
          mv bin/DataCia-amd64_arm64-installer.exe "bin/DataCia-${{ needs.verify.outputs.version }}-windows-universal-installer.exe"
          mv bin/DataCia-amd64-installer.exe "bin/DataCia-${{ needs.verify.outputs.version }}-windows-amd64-installer.exe"
          mv bin/DataCia-arm64-installer.exe "bin/DataCia-${{ needs.verify.outputs.version }}-windows-arm64-installer.exe"
          mv bin/DataCia-amd64.exe "bin/DataCia-${{ needs.verify.outputs.version }}-windows-amd64.exe"
          mv bin/DataCia-arm64.exe "bin/DataCia-${{ needs.verify.outputs.version }}-windows-arm64.exe"
      - uses: actions/upload-artifact@v5
        with:
          name: windows
          path: bin/*-windows-*.exe

  publish:
    needs: [verify, macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v6
        with:
          path: dist
          merge-multiple: true
      - name: Write checksums
        # The in-app updater refuses downloads that are missing from, or don't
        # match, this file.
        working-directory: dist
        run: sha256sum -- * > SHA256SUMS && cat SHA256SUMS
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=()
          case "$GITHUB_REF_NAME" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "DataCia $GITHUB_REF_NAME" --generate-notes "${prerelease[@]}"
