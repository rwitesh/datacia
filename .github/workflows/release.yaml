name: Upload Release

on:
  push:
    branches: [main]
    paths:
      - "output/**"

permissions:
  contents: read

jobs:
  upload-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check output folder exists
        run: |
          if [ ! -d "output" ] || [ -z "$(ls -A output)" ]; then
            echo "No output folder or empty - skipping upload"
            exit 0
          fi

      - name: Upload to Cloudflare R2
        run: |
          chmod +x scripts/upload-cloudflare-r2.sh
          for version_dir in output/V*; do
            if [ -d "$version_dir" ]; then
              ./scripts/upload-cloudflare-r2.sh "$version_dir"
            fi
          done
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: output/V*/**/*
          retention-days: 30
