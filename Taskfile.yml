version: '3'

vars:
  APP_NAME: "DataCia"
  BIN_DIR: "bin"
  PACKAGE_MANAGER: "npm"
  VITE_PORT: '{{.WAILS_VITE_PORT | default 9245}}'
  # Target OS for build/package/run. Defaults to the host OS; override with
  # `wails3 build GOOS=...` (or the GOOS env var) to cross-compile.
  GOOS: '{{.GOOS | default OS}}'
  # App version, taken from the git tag: VERSION=<x.y.z> (CI passes the release tag),
  # otherwise the tag on the checked-out commit, otherwise "dev". Dev builds never
  # auto-update.
  VERSION:
    sh: 'v="${VERSION:-$(git describe --tags --exact-match --match "v[0-9]*" 2>/dev/null || true)}"; v="${v#v}"; echo "${v:-dev}"'
  # Numeric x.y.z for platform metadata (Windows version info and NSIS need digits).
  ASSET_VERSION:
    sh: 'echo "{{.VERSION}}" | sed -E -n "s/^([0-9]+\.[0-9]+\.[0-9]+).*/\1/p" | grep . || echo "0.0.0"'

includes:
  common: ./build/Taskfile.yml
  windows: ./build/windows/Taskfile.yml
  darwin: ./build/darwin/Taskfile.yml

tasks:
  build:
    summary: Builds the application
    cmds:
      - task: "{{.GOOS}}:build"

  package:
    summary: Packages a production build of the application
    cmds:
      - task: "{{.GOOS}}:package"

  run:
    summary: Runs the application
    cmds:
      - task: "{{.GOOS}}:run"

  dev:
    summary: Runs the application in development mode
    cmds:
      - wails3 dev -config ./build/config.yml -port {{.VITE_PORT}}

  test:
    summary: Runs Go tests and frontend lint/type checks
    cmds:
      - go test ./internal/... ./pkg/...
      - task: common:check:frontend
